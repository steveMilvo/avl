<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Texas BBQ Recipes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: menu board on the left, one sheet of butcher paper on the right, the pitmaster's own page beside the recipe. */
:root {
  color-scheme: dark;
  --soot: #100d0b;      /* room */
  --steel: #1d1814;     /* panels */
  --seam: #3b3028;      /* borders */
  --chalk: #f2eadc;     /* text on dark */
  --ash: #a09387;       /* muted text on dark */
  --paper: #dfc0a4;     /* peach butcher paper */
  --ink: #1c1410;       /* text on paper */
  --ink-soft: #5e4a3c;  /* muted text on paper */
  --rule: #b5947a;      /* lines on paper */
  --brick: #8a2314;     /* ticks, running timers */
  --sign: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--soot); color: var(--chalk); font: 400 17px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--soot); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brick); outline-offset: 2px; }
.board :focus-visible, .mast :focus-visible { outline-color: var(--chalk); }
.room {
  max-width: 1280px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.mast { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.mast h1 { margin: 0; font: 800 clamp(1.9rem, 5vw, 2.7rem)/1 var(--sign); letter-spacing: 0.06em; text-transform: uppercase; }
.rig { display: flex; flex-wrap: wrap; gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--seam); background: var(--steel); }
.seg button { border: 0; background: none; padding: 9px 13px; font: 700 0.86rem/1 var(--sign); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ash); }
.seg button[aria-pressed="true"] { background: var(--chalk); color: var(--soot); }

.shell { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 22px; align-items: start; }
.board { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); background: var(--steel); border: 1px solid var(--seam); padding: 16px 12px; }
.board h2 { margin: 18px 6px 6px; font: 700 0.76rem/1 var(--sign); letter-spacing: 0.22em; text-transform: uppercase; color: var(--ash); }
.board h2:first-child { margin-top: 0; }
.board button { display: block; width: 100%; border: 0; background: none; padding: 7px 6px; text-align: left; font: 700 1.12rem/1.15 var(--sign); letter-spacing: 0.08em; text-transform: uppercase; color: var(--chalk); }
.board button:hover { background: var(--seam); }
.board button[aria-current="page"] { background: var(--chalk); color: var(--soot); }

.paper { min-width: 0; background: var(--paper); color: var(--ink); padding: clamp(18px, 3.5vw, 36px); }
.paper:focus { outline: none; }
.kicker { margin: 0 0 6px; font: 700 0.8rem/1 var(--sign); letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-soft); }
.paper h2 { margin: 0; font: 800 clamp(2rem, 5.5vw, 3.2rem)/0.95 var(--sign); letter-spacing: 0.02em; text-transform: uppercase; text-wrap: balance; }
.tabs { display: inline-flex; margin-top: 16px; border: 2px solid var(--ink); }
.tabs button { border: 0; background: none; padding: 8px 14px; color: var(--ink); font: 700 0.9rem/1 var(--sign); letter-spacing: 0.1em; text-transform: uppercase; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.82fr); gap: 28px 36px; margin-top: 20px; align-items: start; }
.work { min-width: 0; display: flex; flex-direction: column; gap: 22px; }

/* batch */
.batch { border-block: 2px solid var(--ink); padding-block: 14px; display: flex; flex-direction: column; gap: 12px; }
.step { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.step .x { min-width: 3.1em; text-align: center; font: 800 3rem/0.9 var(--sign); font-variant-numeric: tabular-nums; }
.round { width: 48px; height: 48px; border: 2px solid var(--ink); background: none; color: var(--ink); font: 700 1.7rem/1 var(--sign); }
.round:hover, .chips button:hover, .ghost:hover { background: color-mix(in srgb, var(--ink) 12%, transparent); }
.tot { font-weight: 600; color: var(--ink-soft); }
.label { font: 700 0.8rem/1 var(--sign); letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips button, .ghost { border: 1.5px solid var(--ink); background: none; color: var(--ink); padding: 7px 11px; min-width: 46px; font: 700 0.98rem/1 var(--body); }
.chips button[aria-pressed="true"], .chips button[aria-pressed="true"]:hover { background: var(--ink); color: var(--paper); }
.exact { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; margin-left: 6px; }
.exact input, .pin input { width: 4.8em; border: 0; border-bottom: 2px solid var(--ink); background: color-mix(in srgb, var(--chalk) 50%, transparent); color: var(--ink); padding: 6px 5px; font-weight: 700; }

/* ingredients */
.sec h3 { margin: 0 0 2px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font: 700 0.9rem/1 var(--sign); letter-spacing: 0.2em; text-transform: uppercase; }
.sec h3 button { border: 0; background: none; padding: 0; text-decoration: underline; color: var(--ink-soft); font: 600 0.8rem/1 var(--sign); letter-spacing: 0.1em; text-transform: uppercase; }
.sub { margin: 16px 0 0; font: 700 0.82rem/1 var(--sign); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }
.ings { list-style: none; margin: 0; padding: 0; }
.ings li { display: grid; grid-template-columns: 24px minmax(5.6em, auto) minmax(0, 1fr); gap: 4px 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--rule); }
.ings.list li { grid-template-columns: 24px minmax(0, 1fr); }
.tickbox { width: 22px; height: 22px; border: 2px solid var(--ink); background: none; padding: 0; align-self: center; display: grid; place-items: center; }
.tickbox[aria-checked="true"] { background: var(--ink); }
.tickbox[aria-checked="true"]::after { content: ""; width: 11px; height: 6px; border: solid var(--paper); border-width: 0 0 3px 3px; transform: translateY(-2px) rotate(-45deg); }
.qty { border: 0; background: none; padding: 0; text-align: left; color: var(--ink); font: 700 1.08rem/1.3 var(--body); font-variant-numeric: tabular-nums; text-decoration: underline dotted var(--ink-soft); text-underline-offset: 4px; }
.qty.plain { text-decoration: none; cursor: default; }
.qty:not(.plain):hover { color: var(--brick); }
.nm { min-width: 0; font-weight: 500; }
.nm small { display: block; font-size: 0.86rem; line-height: 1.35; color: var(--ink-soft); }
.nm .alt { font-size: 0.86rem; color: var(--ink-soft); white-space: nowrap; }
li.done .nm, li.done .qty { text-decoration: line-through; opacity: 0.5; }
.pin { grid-column: 2 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-weight: 600; }
.hint { margin: 8px 0 0; font-size: 0.86rem; color: var(--ink-soft); }

/* method */
.steps { list-style: none; margin: 8px 0 0; padding: 0; counter-reset: s; display: flex; flex-direction: column; gap: 12px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; }
.steps li::before { content: counter(s); font: 800 1.5rem/1.1 var(--sign); }
.steps p { margin: 0; max-width: 60ch; }
.timer { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-weight: 600; }
.timer .clock { font: 800 1.6rem/1 var(--sign); font-variant-numeric: tabular-nums; }
.timer.up .clock, .timer.up { color: var(--brick); }
.goes { margin: 14px 0 0; font-weight: 600; }

/* the pitmaster's page */
.notes { min-width: 0; display: flex; flex-direction: column; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.note { border: 0; padding: 0; background: none; display: block; width: 100%; text-align: left; }
.note img { display: block; width: 100%; height: auto; border: 1px solid var(--rule); }
.note span { display: block; margin-top: 5px; font: 700 0.76rem/1 var(--sign); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); }

dialog { border: 0; padding: 0; background: var(--steel); color: var(--chalk); max-width: min(96vw, 1000px); max-height: 94vh; }
dialog::backdrop { background: color-mix(in srgb, var(--soot) 88%, transparent); }
.dlg-bar { display: flex; justify-content: flex-end; padding: 8px; }
.dlg-bar button { border: 1px solid var(--seam); background: none; padding: 7px 14px; font: 700 0.86rem/1 var(--sign); letter-spacing: 0.12em; text-transform: uppercase; }
dialog img { display: block; max-width: 100%; max-height: calc(94vh - 52px); margin: 0 auto; }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .board { position: static; display: flex; gap: 4px; overflow-x: auto; padding: 8px; align-items: center; }
  .board h2 { display: none; }
  .board button { width: auto; white-space: nowrap; padding: 8px 10px; font-size: 1rem; }
  .body { grid-template-columns: minmax(0, 1fr); }
  .notes { position: static; }
}
</style>
</head>
<body>
<div class="room">
  <header class="mast">
    <h1>Texas BBQ Recipes</h1>
    <div class="rig">
      <div class="seg" role="group" aria-label="Show quantities in">
        <button type="button" id="mode-kitchen" data-mode="kitchen">Cups &amp; spoons</button>
        <button type="button" id="mode-metric" data-mode="metric">Metric</button>
      </div>
      <div class="seg" role="group" aria-label="Measuring set">
        <button type="button" id="set-au" data-set="au" title="250 ml cup, 20 ml tablespoon">AU measures</button>
        <button type="button" id="set-us" data-set="us" title="237 ml cup, 15 ml tablespoon">US measures</button>
      </div>
    </div>
  </header>
  <div class="shell">
    <nav class="board" id="board" aria-label="Recipes"></nav>
    <main class="paper" id="sheet" tabindex="-1"></main>
  </div>
</div>

<dialog id="viewer" aria-label="Original page">
  <div class="dlg-bar"><button type="button" id="viewer-close">Close</button></div>
  <img id="viewer-img" alt="">
</dialog>

<script>
(function () {
'use strict';

/* ---------- the recipes, as written ---------- */
var I = function (q, u, name, note, extra) { var o = { q: q, u: u, name: name, note: note || '' }; if (extra) for (var k in extra) o[k] = extra[k]; return o; };
var RECIPES = [
  { id: 'southern-comfort-sauce', group: 'Sauces', name: 'Southern Comfort BBQ Sauce', pages: [10, 1], total: 'vol',
    ings: [
      I(1, 'cup', 'Yellow mustard'), I(0.5, 'cup', 'Southern Comfort liquor'), I(0.5, 'cup', 'Molasses'),
      I(0.5, 'cup', 'Cider vinegar'), I(0.25, 'cup', 'Dark brown sugar', 'packed'), I(0.25, 'cup', 'Worcestershire sauce'),
      I(2, 'tbsp', 'Fresh lemon juice'), I(2, 'tbsp', 'Soy sauce'), I(2, 'tsp', 'Granulated garlic'),
      I(2, 'tsp', 'Black pepper'), I(1, 'tsp', 'Crushed red pepper'), I(1, 'tsp', 'Cayenne pepper'), I(1, 'tsp', 'Salt'),
      I(1, 'bottle', 'Tomato sauce / ketchup', '28 oz bottle')
    ] },

  { id: 'bbq-sauce-2-litre', group: 'Sauces', name: 'BBQ Sauce, 2 Litre Batch', pages: [2], total: 'vol',
    ings: [
      I(1, 'tbsp', 'Black pepper', '', { sub: 'Dry' }), I(4, 'tsp', 'Ground coriander'), I(4, 'tsp', 'Dry mustard powder'),
      I(2, 'tsp', 'Ground ginger'), I(2, 'tsp', 'Granulated garlic'), I(2, 'tsp', 'Cayenne pepper'), I(1, 'tsp', 'Nutmeg'),
      I(2, 'l', 'Tomato sauce / ketchup', '', { sub: 'Wet' }), I(550, 'ml', 'Tomato paste'),
      I(2, 'cup', 'White vinegar'), I(2, 'cup', 'Molasses'), I(0.5, 'cup', 'Worcestershire sauce'), I(4, 'tbsp', 'Liquid smoke')
    ],
    steps: [
      { t: 'Combine all dry ingredients in a non-reactive saucepan.' },
      { t: 'Add all wet ingredients, blending well.' },
      { t: 'Bring to the boil.' },
      { t: 'Reduce the heat and simmer for approx. 30 mins, stirring occasionally.', min: 30 }
    ],
    goes: 'Good for beef, pork ribs and chicken.' },

  { id: 'bbq-sauce-apricot', group: 'Sauces', name: 'BBQ Sauce, Apricot', pages: [8],
    ings: [
      I(null, null, 'Home Brand tomato sauce', '8–12 hrs'),

      I(null, null, 'Black pepper'), I(null, null, 'Paprika'), I(null, null, 'Onion powder'),
      I(null, null, 'Gravy, plain', '', { sub: 'Gravy' }), I(null, null, 'Liquid smoke')
    ] },

  { id: 'rub', group: 'Rubs', name: 'Rub for Meat', pages: [3, 11],
    variants: [
      { key: 'spoon', label: 'Cup & spoon', ings: [
        I(0.5, 'cup', 'Brown sugar'), I(0.25, 'cup', 'Paprika'), I(4, 'tbsp', 'Coarse salt'), I(3, 'tbsp', 'Black pepper'),
        I(2, 'tsp', 'Onion powder / salt'), I(2, 'tsp', 'Garlic powder / salt'),
        I(2, 'tsp', 'Celery seed'), I(1, 'tsp', 'Cayenne pepper')
      ] },
      { key: 'weight', label: 'Bulk rub by weight', total: 'weight', ings: [
        I(65, 'g', 'Brown sugar'), I(26, 'g', 'Paprika'), I(80, 'g', 'Salt'), I(27, 'g', 'Ground pepper'),
        I(22, 'g', 'Onion powder'), I(16, 'g', 'Garlic powder'), I(7, 'g', 'Celery seeds'), I(5, 'g', 'Cayenne pepper')
      ] }
    ] },

  { id: 'brisket-injection', group: 'Injections & marinades', name: 'Beef Brisket Injection', pages: [6, 5], total: 'vol',
    ings: [
      I(2, 'cup', 'Beef base / stock'), I(1, 'tbsp', 'Worcestershire sauce'), I(1, 'tbsp', 'Soy sauce'),
      I(1, 'tsp', 'Accent seasoning (MSG)', 'or adobo seasoning')
    ] },

  { id: 'pork-injection', group: 'Injections & marinades', name: 'Pork Injection', pages: [7],
    ings: [ I(null, null, 'Apple juice'), I(null, null, 'Apple cider vinegar'), I(null, null, 'Thai chilli garlic sauce'), I(null, null, 'Onion powder') ] },

  { id: 'marinade', group: 'Injections & marinades', name: 'Marinade', pages: [4], total: 'vol',
    ings: [
      I(1 / 3, 'cup', 'Sherry'), I(0.25, 'tsp', '5 spice'), I(1, 'tsp', 'Garlic'), I(1, 'tsp', 'Ginger'),
      I(1, 'tbsp', 'Hot chilli sauce'), I(2, 'tbsp', 'Soy sauce'), I(4, 'tbsp', 'Brown vinegar'),
      I(4, 'tbsp', 'BBQ sauce'), I(4, 'tbsp', 'Honey')
    ] },

  { id: 'fried-chicken', group: 'Chicken', name: 'Southern Fried Chicken', pages: [9],
    ings: [
      I(null, null, 'Black peppercorns', '', { sub: 'Brine', loose: 'handful' }),
      I(null, null, 'Thyme', '', { loose: 'sprigs' }),
      I(4, 'count', 'Fresh bay leaves'), I(4, 'count', 'Garlic cloves'),
      I(100, 'g', 'Salt'), I(100, 'g', 'Brown sugar'),
      I(400, 'ml', 'Water'), I(400, 'ml', 'Water', 'added off the heat'),
      I(4, 'count', 'Drumsticks', 'cut slits in', { sub: 'Chicken' }), I(4, 'count', 'Thighs'),
      I(null, null, 'Buttermilk', '', { sub: 'Soak' })
    ],
    steps: [
      { t: 'Brine: stir over flame until it boils.' },
      { t: 'Take off the heat, add the second lot of water and let it cool down completely.' },
      { t: 'Place chicken in the brine and fridge overnight, at least 12 hrs.', min: 720 },
      { t: 'Soak chicken in buttermilk for at least 8 hours after brining.', min: 480 }
    ] },

  { id: 'cook-day', group: 'Cook day', name: 'Cook Day List', pages: [4], list: true,
    ings: [
      I(null, null, 'Coke', '2 ltr'), I(null, null, 'Apple juice', '2 ltr'), I(null, null, 'Foil'), I(null, null, 'Cling wrap'),
      I(null, null, 'Paper towel'), I(null, null, 'Serviettes'), I(null, null, 'Cabbage'), I(null, null, 'Carrot'),
      I(null, null, 'Onion'), I(null, null, 'Apples'), I(null, null, 'Coleslaw dressing'), I(null, null, 'Hose couplings'), I(null, null, 'Seats')
    ] }
];

/* ---------- measures ---------- */
var SETS = { au: { tsp: 5, tbsp: 4, cup: 50 }, us: { tsp: 4.929, tbsp: 3, cup: 48 } }; /* ml per tsp; tsp per Tbs; tsp per cup */
var KETCHUP_G = 794, KETCHUP_ML = 700; /* 28 oz bottle */
var STOPS = [0.25, 0.5, 0.75, 1, 1.5, 2, 3, 4, 5, 6, 8, 10, 15, 20];
var GLYPH = { '1/2': '½', '1/3': '⅓', '2/3': '⅔', '1/4': '¼', '3/4': '¾', '1/8': '⅛', '3/8': '⅜', '5/8': '⅝', '7/8': '⅞' };

function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('pit.' + k)); localStorage.setItem('pit.' + k, JSON.stringify(v)); } catch (e) { return null; } }
var prefs = store('prefs') || {};
var state = { mode: prefs.mode === 'metric' ? 'metric' : 'kitchen', set: prefs.set === 'us' ? 'us' : 'au', id: null, pin: -1 };
var saved = store('recipes') || {};   /* per recipe: { s: scale, v: variant, c: {i: true} } */
var timers = store('timers') || {};   /* key -> end timestamp */
function mem(id) { return saved[id] || (saved[id] = { s: 1, v: 0, c: {} }); }
function persist() { store('recipes', saved); store('prefs', { mode: state.mode, set: state.set }); store('timers', timers); }

function trim(n, d) { return String(+n.toFixed(d)); }
function gcd(a, b) { return b ? gcd(b, a % b) : a; }
/* nearest mixed fraction using the given denominators */
function mixed(x, dens) {
  var best = null;
  dens.forEach(function (d) {
    var n = Math.round(x * d), val = n / d;
    if (!best || Math.abs(val - x) < Math.abs(best.val - x) - 1e-9) best = { n: n, d: d, val: val };
  });
  var whole = Math.floor(best.n / best.d + 1e-9), rem = best.n - whole * best.d, g = gcd(rem, best.d);
  var f = rem ? GLYPH[(rem / g) + '/' + (best.d / g)] : '';
  return { text: (whole || !f ? whole : '') + f, val: best.val };
}
function mul(s) { return s === 0.25 ? '¼' : s === 0.5 ? '½' : s === 0.75 ? '¾' : s === 1.5 ? '1½' : trim(s, 2); }

function metric(v, unit) {
  if (unit === 'ml') {
    if (v >= 1000) return trim(v / 1000, v >= 10000 ? 1 : 2) + ' L';
    return (v < 20 ? trim(Math.round(v * 2) / 2, 1) : v < 100 ? Math.round(v) : Math.round(v / 5) * 5) + ' ml';
  }
  if (v >= 1000) return trim(v / 1000, v >= 10000 ? 1 : 2) + ' kg';
  return (v < 20 ? trim(v, 1) : Math.round(v)) + ' g';
}
function spoons(tsp) {
  var S = SETS[state.set], tries = [];
  if (tsp >= S.cup / 4 - 1e-6) tries.push(['cup', S.cup, [2, 3, 4]]);
  if (tsp >= S.tbsp - 1e-6) tries.push(['Tbs', S.tbsp, [2]]);
  tries.push(['tsp', 1, tsp < 1 ? [2, 4, 8] : [2, 4]]);
  var pick = null;
  for (var i = 0; i < tries.length; i++) {
    var m = mixed(tsp / tries[i][1], tries[i][2]), err = Math.abs(m.val * tries[i][1] - tsp) / tsp;
    if (m.val > 0 && err <= 0.04) { pick = [m, tries[i][0]]; break; }
    if (!pick || err < pick[2]) pick = [m, tries[i][0], err];
  }
  var unit = pick[1] === 'cup' && pick[0].val > 1 ? 'cups' : pick[1];
  return pick[0].text === '0' ? 'pinch' : pick[0].text + ' ' + unit;
}
function toTsp(ing) { var S = SETS[state.set]; return ing.u === 'tsp' ? ing.q : ing.u === 'tbsp' ? ing.q * S.tbsp : ing.q * S.cup; }
function toMl(ing, s) {
  if (ing.u === 'ml') return ing.q * s;
  if (ing.u === 'l') return ing.q * 1000 * s;
  if (ing.u === 'bottle') return KETCHUP_ML * ing.q * s;
  if (ing.u === 'tsp' || ing.u === 'tbsp' || ing.u === 'cup') return toTsp(ing) * s * SETS[state.set].tsp;
  return 0;
}
/* { main, alt } for one ingredient at scale s */
function amount(ing, s) {
  if (ing.q == null) return { main: ing.loose || '', alt: '' };
  var k, m;
  switch (ing.u) {
    case 'tsp': case 'tbsp': case 'cup': k = spoons(toTsp(ing) * s); m = metric(toMl(ing, s), 'ml'); break;
    case 'ml': case 'l': k = m = metric(toMl(ing, s), 'ml'); break;
    case 'g': k = m = metric(ing.q * s, 'g'); break;
    case 'bottle': var b = mixed(ing.q * s, [2, 4]); k = b.text + ' × 28 oz'; m = metric(KETCHUP_G * ing.q * s, 'g'); break;
    default: var c = mixed(ing.q * s, [2, 4]); k = m = c.text + (ing.unit1 ? ' ' + (c.val === 1 ? ing.unit1 : ing.unitN) : '');
  }
  return state.mode === 'metric' ? { main: m, alt: k === m ? '' : k } : { main: k, alt: k === m ? '' : m };
}
var UNIT_WORD = { tsp: 'tsp', tbsp: 'Tbs', cup: 'cups', ml: 'ml', l: 'litres', g: 'g', bottle: 'bottles', count: '' };

/* ---------- rendering ---------- */
var $ = function (id) { return document.getElementById(id); };
var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var sheet = $('sheet'), board = $('board');
function recipe() { return RECIPES.filter(function (r) { return r.id === state.id; })[0] || RECIPES[0]; }
function active(r) { var m = mem(r.id); return r.variants ? r.variants[m.v] || r.variants[0] : r; }
function img(p) { return 'notes/p' + (p < 10 ? '0' : '') + p + '.jpg'; }

function drawBoard() {
  var h = '', g = '';
  RECIPES.forEach(function (r) {
    if (r.group !== g) { g = r.group; h += '<h2>' + esc(g) + '</h2>'; }
    h += '<button type="button" data-go="' + r.id + '"' + (r.id === state.id ? ' aria-current="page"' : '') + '>' + esc(r.name) + '</button>';
  });
  board.innerHTML = h;
}
function totalLine(v, s) {
  if (v.total === 'vol') { var ml = 0; v.ings.forEach(function (g) { ml += toMl(g, s); }); return 'about ' + metric(ml, 'ml'); }
  if (v.total === 'weight') { var w = 0; v.ings.forEach(function (g) { w += g.q * s; }); return metric(w, 'g'); }
  return '';
}

function draw() {
  var r = recipe(), m = mem(r.id), v = active(r), s = m.s, h = '';
  var scalable = !r.list && v.ings.some(function (g) { return g.q != null; });
  h += '<p class="kicker">' + esc(r.group) + '</p><h2>' + esc(r.name) + '</h2>';
  if (r.variants) {
    h += '<div class="tabs" role="group" aria-label="Version">';
    r.variants.forEach(function (x, i) { h += '<button type="button" data-variant="' + i + '" aria-pressed="' + (i === m.v) + '">' + esc(x.label) + '</button>'; });
    h += '</div>';
  }
  h += '<div class="body"><div class="work">';

  if (scalable) {
    h += '<section class="batch" aria-label="Batch size"><span class="label">Batch size</span><div class="step">';
    h += '<button type="button" class="round" data-nudge="-1" aria-label="Smaller batch">−</button><span class="x" aria-live="polite">×' + mul(s) + '</span><button type="button" class="round" data-nudge="1" aria-label="Bigger batch">+</button>';
    h += '<span class="tot">' + esc(totalLine(v, s)) + '</span></div><div class="chips">';
    [0.5, 1, 2, 4, 10].forEach(function (c) { h += '<button type="button" data-scale="' + c + '" aria-pressed="' + (c === s) + '">×' + mul(c) + '</button>'; });
    h += '<label class="exact" for="exact">×<input id="exact" type="number" inputmode="decimal" min="0.1" max="100" step="0.25" value="' + trim(s, 3) + '"></label>';
    h += '</div></section>';
  }

  h += '<section class="sec"><h3><span>' + (r.list ? 'List' : 'Ingredients') + '</span><button type="button" data-clear="1">Clear ticks</button></h3><ul class="ings' + (r.list ? ' list' : '') + '">';
  v.ings.forEach(function (g, i) {
    if (g.sub) h += '</ul><p class="sub">' + esc(g.sub) + '</p><ul class="ings">';
    var a = amount(g, s), done = !!m.c[m.v + ':' + i];
    h += '<li class="' + (done ? 'done' : '') + '"><button type="button" class="tickbox" role="checkbox" aria-checked="' + done + '" aria-label="' + esc(g.name) + '" data-tick="' + i + '"></button>';
    if (!r.list) {
      if (g.q != null) h += '<button type="button" class="qty" data-pin="' + i + '" title="Scale the batch from this ingredient">' + esc(a.main) + '</button>';
      else h += '<span class="qty plain">' + esc(a.main) + '</span>';
    }
    h += '<span class="nm">' + esc(g.name) + (a.alt ? ' <span class="alt">' + esc(a.alt) + '</span>' : '');
    if (g.note) h += '<small>' + esc(g.note) + '</small>';
    h += '</span>';
    if (state.pin === i) {
      h += '<form class="pin" data-pinform="' + i + '"><label for="pin-in">I have</label><input id="pin-in" type="number" inputmode="decimal" min="0" step="any" value="' + trim(g.q * s, 3) + '"><span>' + (g.unitN || UNIT_WORD[g.u]) + '</span><button type="submit" class="ghost">Scale batch</button></form>';
    }
    h += '</li>';
  });
  h += '</ul>';
  if (scalable) h += '<p class="hint">Tap a quantity to scale the batch from what you have.</p>';
  h += '</section>';

  if (r.steps) {
    h += '<section class="sec"><h3><span>Method</span></h3><ol class="steps">';
    r.steps.forEach(function (st, i) {
      h += '<li><div><p>' + esc(st.t) + '</p>';
      if (st.min) h += '<div class="timer" data-timer="' + r.id + ':' + i + '" data-min="' + st.min + '"></div>';
      h += '</div></li>';
    });
    h += '</ol>';
    if (r.goes) h += '<p class="goes">' + esc(r.goes) + '</p>';
    h += '</section>';
  }
  h += '</div><aside class="notes" aria-label="Original pages">';
  r.pages.forEach(function (p) {
    h += '<button type="button" class="note" data-note="' + p + '"><img src="' + img(p) + '" alt="The pitmaster’s handwritten page for ' + esc(r.name) + '" loading="lazy"><span>Original page · tap to enlarge</span></button>';
  });
  h += '</aside></div>';
  sheet.innerHTML = h;
  drawTimers();
  var pinIn = $('pin-in'); if (pinIn) { pinIn.focus(); pinIn.select(); }
  ['kitchen', 'metric'].forEach(function (k) { $('mode-' + k).setAttribute('aria-pressed', state.mode === k); });
  ['au', 'us'].forEach(function (k) { $('set-' + k).setAttribute('aria-pressed', state.set === k); });
}

function setScale(s) {
  if (!isFinite(s) || s <= 0) return;
  mem(state.id).s = Math.min(100, Math.max(0.1, +s.toFixed(3)));
  state.pin = -1; persist(); draw();
}
function nudge(dir) {
  var s = mem(state.id).s, i;
  if (dir > 0) { for (i = 0; i < STOPS.length; i++) if (STOPS[i] > s + 1e-6) return setScale(STOPS[i]); }
  else { for (i = STOPS.length - 1; i >= 0; i--) if (STOPS[i] < s - 1e-6) return setScale(STOPS[i]); }
}

/* ---------- timers ---------- */
function clock(ms) {
  var t = Math.max(0, Math.round(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (s < 10 ? '0' : '') + s;
}
function span(min) { return min >= 60 ? (min / 60) + ' hr' : min + ' min'; }
function drawTimers() {
  var now = Date.now();
  Array.prototype.forEach.call(document.querySelectorAll('[data-timer]'), function (el) {
    var key = el.getAttribute('data-timer'), min = +el.getAttribute('data-min'), end = timers[key], mode = !end ? 'idle' : end > now ? 'run' : 'up';
    if (el.getAttribute('data-state') !== mode) {
      el.setAttribute('data-state', mode); el.className = 'timer' + (mode === 'up' ? ' up' : '');
      if (mode === 'idle') el.innerHTML = '<button type="button" class="ghost" data-start="' + key + '">Start ' + span(min) + ' timer</button>';
      else {
        var when = new Date(end).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
        el.innerHTML = '<span class="clock"></span><span>' + (mode === 'up' ? 'Done' : 'ready ' + esc(when)) + '</span><button type="button" class="ghost" data-stop="' + key + '">' + (mode === 'up' ? 'Clear' : 'Cancel') + '</button>';
      }
    }
    var c = el.querySelector('.clock'); if (c) c.textContent = mode === 'up' ? '0:00' : clock(end - now);
  });
}
setInterval(drawTimers, 1000);

/* ---------- events ---------- */
function go(id, focus) {
  state.id = (RECIPES.filter(function (r) { return r.id === id; })[0] || RECIPES[0]).id; state.pin = -1;
  drawBoard(); draw();
  if (focus) { sheet.focus({ preventScroll: true }); if (sheet.getBoundingClientRect().top < 0) sheet.scrollIntoView({ block: 'start' }); }
}
window.addEventListener('hashchange', function () { var id = location.hash.slice(1); if (id && id !== state.id) go(id, true); });

document.addEventListener('click', function (e) {
  var t = e.target.closest('button'); if (!t) return;
  var d = t.dataset, m = state.id ? mem(state.id) : null;
  if (d.go) { try { location.hash = d.go; } catch (x) {} go(d.go, true); }
  else if (d.mode) { state.mode = d.mode; persist(); draw(); }
  else if (d.set) { state.set = d.set; persist(); draw(); }
  else if (d.scale) setScale(+d.scale);
  else if (d.nudge) { nudge(+d.nudge); var b = sheet.querySelector('[data-nudge="' + d.nudge + '"]'); if (b) b.focus(); }
  else if (d.variant) { m.v = +d.variant; state.pin = -1; persist(); draw(); }
  else if (d.tick) { var k = m.v + ':' + d.tick; if (m.c[k]) delete m.c[k]; else m.c[k] = true; persist(); draw(); }
  else if (d.clear) { m.c = {}; persist(); draw(); }
  else if (d.pin) { state.pin = state.pin === +d.pin ? -1 : +d.pin; draw(); }
  else if (d.note) openNote(+d.note);
  else if (d.start) { timers[d.start] = Date.now() + (+t.closest('[data-timer]').getAttribute('data-min')) * 60000; persist(); drawTimers(); }
  else if (d.stop) { delete timers[d.stop]; persist(); drawTimers(); }
});
document.addEventListener('submit', function (e) {
  var f = e.target.closest('[data-pinform]'); if (!f) return;
  e.preventDefault();
  var g = active(recipe()).ings[+f.dataset.pinform], val = parseFloat(f.querySelector('input').value);
  if (val > 0) setScale(val / g.q);
});
document.addEventListener('change', function (e) { if (e.target.id === 'exact') setScale(parseFloat(e.target.value)); });

var viewer = $('viewer');
function openNote(p) {
  $('viewer-img').src = img(p); $('viewer-img').alt = 'Original handwritten page';
  if (viewer.showModal) viewer.showModal(); else viewer.setAttribute('open', '');
}
$('viewer-close').addEventListener('click', function () { viewer.close(); });
viewer.addEventListener('click', function (e) { if (e.target === viewer) viewer.close(); });

go(location.hash.slice(1) || RECIPES[0].id, false);
})();
</script>
</body>
</html>
