# Paste onto the blank screen scrHome (select the screen, then Ctrl+V).
# Set scrHome.OnVisible separately - see App.fx.md.
- hdrHome:
    Control: Label
    Properties:
      Text: |-
        ="AusGrape Packing Supplies"
      X: |-
        =0
      Y: |-
        =0
      Width: |-
        =Parent.Width
      Height: |-
        =110
      Fill: |-
        =varGreen
      Color: |-
        =White
      Size: |-
        =24
      FontWeight: |-
        =FontWeight.Bold
      Align: |-
        =Align.Center
- lblHello:
    Control: Label
    Properties:
      Text: |-
        =If(IsBlank(varMe),
            "You are not set up yet (" & User().Email & "). You can still take stock with your AVL ID. Ask Peter to add you.",
            "Hi " & varMe.Title & If(varIsManager, "  ·  Manager", ""))
      X: |-
        =20
      Y: |-
        =125
      Width: |-
        =Parent.Width - 40
      Height: |-
        =80
      Size: |-
        =15
- btnHomeTake:
    Control: Classic/Button
    Properties:
      Text: |-
        ="TAKE STOCK FROM STORAGE"
      OnSelect: |-
        =Navigate(scrTake, ScreenTransition.Cover)
      X: |-
        =20
      Y: |-
        =220
      Width: |-
        =Parent.Width - 40
      Height: |-
        =140
      Fill: |-
        =varGreen
      Size: |-
        =22
      RadiusTopLeft: |-
        =12
      RadiusTopRight: |-
        =12
      RadiusBottomLeft: |-
        =12
      RadiusBottomRight: |-
        =12
- btnHomeMine:
    Control: Classic/Button
    Properties:
      Text: |-
        ="Today's takes / undo"
      OnSelect: |-
        =Navigate(scrMyTakes, ScreenTransition.Cover)
      X: |-
        =20
      Y: |-
        =380
      Width: |-
        =Parent.Width - 40
      Height: |-
        =90
      Fill: |-
        =RGBA(60, 60, 60, 1)
      Size: |-
        =18
- btnHomeLevels:
    Control: Classic/Button
    Properties:
      Text: |-
        ="Stock levels"
      OnSelect: |-
        =Navigate(scrLevels, ScreenTransition.Cover)
      X: |-
        =20
      Y: |-
        =490
      Width: |-
        =Parent.Width - 40
      Height: |-
        =90
      Fill: |-
        =RGBA(60, 60, 60, 1)
      Size: |-
        =18
- btnHomeReceive:
    Control: Classic/Button
    Properties:
      Text: |-
        ="MANAGER: Receive / Count / Transfer"
      OnSelect: |-
        =Navigate(scrReceive, ScreenTransition.Cover)
      Visible: |-
        =varIsManager
      X: |-
        =20
      Y: |-
        =620
      Width: |-
        =Parent.Width - 40
      Height: |-
        =110
      Fill: |-
        =RGBA(0, 70, 140, 1)
      Size: |-
        =18
- lblHomeFoot:
    Control: Label
    Properties:
      Text: |-
        ="Every take is recorded against your AVL ID with the time and job / order number."
      X: |-
        =20
      Y: |-
        =Parent.Height - 90
      Width: |-
        =Parent.Width - 40
      Height: |-
        =70
      Size: |-
        =12
      Color: |-
        =RGBA(90, 90, 90, 1)
