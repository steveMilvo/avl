      X: |-
        =20
      Y: |-
        =207
      Width: |-
        =Parent.Width - 40
      Height: |-
        =56
      Size: |-
        =16
- lblRItem:
    Control: Label
    Properties:
      Text: |-
        ="Item"
      X: |-
        =20
      Y: |-
        =270
      Width: |-
        =Parent.Width - 40
      Height: |-
        =32
      Size: |-
        =14
      FontWeight: |-
        =FontWeight.Semibold
- ddRItem:
