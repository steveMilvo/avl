        =["Receive delivery", "Stocktake count", "Transfer to other store"]
      Default: |-
        ="Receive delivery"
      X: |-
        =20
      Y: |-
        =105
      Width: |-
        =Parent.Width - 40
      Height: |-
        =60
      Size: |-
        =18
- lblRSection:
    Control: Label
    Properties:
      Text: |-
        ="Section"
      X: |-
        =20
      Y: |-
        =175
      Width: |-
        =Parent.Width - 40
      Height: |-
        =32
      Size: |-
        =14
      FontWeight: |-
        =FontWeight.Semibold
- ddRSection:
